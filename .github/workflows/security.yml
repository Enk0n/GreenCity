name: Security & Vulnerability Scanning (Trivy & Snyk)

on:
  push:
    branches:
      - security-scan
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  snyk-sca:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Snyk to check Backcore dependencies
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app/greencity-backcore/pom.xml --severity-threshold=high

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Snyk to check Frontend dependencies
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app/greencity-frontend/package.json --severity-threshold=high

  trivy-image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - greencity-backcore
          - greencity-backuser
          - greencity-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on GHCR image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/enk0n/${{ matrix.image }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'