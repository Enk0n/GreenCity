apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencity-backend
  namespace: greencity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greencity-backend
  template:
    metadata:
      labels:
        app: greencity-backend
    spec:
      containers:
        - name: backend
          image: greencity-backcore:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/greencity"
            - name: DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/greencity"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: AZURE_CONNECTION_STRING
              value: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey;EndpointSuffix=core.windows.net"
            - name: AZURE_CONTAINER_NAME
              value: "greencity"

            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              memory: "350Mi"
              cpu: "200m"
            limits:
              memory: "700Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: greencity-backend-service
  namespace: greencity
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: greencity-backend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greencity-ingress
  namespace: greencity
  annotations:
    ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: greencity-backend-service
                port:
                  number: 8080
