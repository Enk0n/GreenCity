apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencity-frontend
  namespace: greencity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greencity-frontend
  template:
    metadata:
      labels:
        app: greencity-frontend
    spec:
      containers:
        - name: frontend
          image: 054394900199.dkr.ecr.eu-central-1.amazonaws.com/greencity-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    find /usr/share/nginx/html -type f -name "*.js" -exec sed -i \
                      "s|http://localhost:8080|https://18.197.104.174|g; \
                       s|http://localhost:8060|https://18.197.104.174|g; \
                       s|http://63.177.238.5|https://18.197.104.174|g; \
                       s|https://63.177.238.5|https://18.197.104.174|g; \
                       s|http://18.197.104.174:8080|https://18.197.104.174|g; \
                       s|http://18.197.104.174:8060|https://18.197.104.174|g; \
                       s|http://18.197.104.174|https://18.197.104.174|g" {} +
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"

---
apiVersion: v1
kind: Service
metadata:
  name: greencity-frontend-service
  namespace: greencity
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: greencity-frontend
